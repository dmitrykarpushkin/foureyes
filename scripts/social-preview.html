<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1280px;height:640px;background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#e6edf3}
  .wrap{box-sizing:border-box;width:1280px;height:640px;padding:44px 64px;display:flex;flex-direction:column;justify-content:center;gap:28px}
  .name{font-size:84px;font-weight:800;letter-spacing:-1.5px;line-height:1}
  .name span{color:#7ee787}
  .promise{font-size:32px;line-height:1.3;color:#c9d1d9;margin-top:16px;max-width:1100px}
  .card{border-radius:14px;overflow:hidden;width:800px;flex-shrink:0;align-self:center;box-shadow:0 0 0 1px #30363d}
  .card img{display:block;width:800px}
</style></head><body>
<div class="wrap">
  <div><div class="name">four<span>eyes</span></div>
  <div class="promise">A referee for coding agents: the agent that built a change is never the one that tests or approves it.</div></div>
  <div class="card"><img src="../docs/diagram.svg" alt=""></div>
</div>
</body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>foureyes: the agent that built a change never tests or validates it</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="379" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#1f2328">Nobody judges their own work</text>
  <text x="40" y="80" font-size="15" fill="#57606a">Each stage is closed by a different agent. The engine compares ids and refuses a repeat.</text>

  <!-- boxes -->
  <g>
    <rect x="40" y="120" width="240" height="96" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
    <text x="160" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#0a3069">builder-1</text>
    <text x="160" y="181" text-anchor="middle" font-size="14" fill="#0a3069">writes the change</text>
    <text x="160" y="201" text-anchor="middle" font-size="14" fill="#0a3069">and commits it</text>
  </g>
  <g>
    <rect x="360" y="120" width="240" height="96" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="480" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2d00">tester-1</text>
    <text x="480" y="181" text-anchor="middle" font-size="14" fill="#4d2d00">runs it for real</text>
    <text x="480" y="201" text-anchor="middle" font-size="14" fill="#4d2d00">a fail sends it back</text>
  </g>
  <g>
    <rect x="680" y="120" width="240" height="96" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
    <text x="800" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#044f1e">validator-1</text>
    <text x="800" y="181" text-anchor="middle" font-size="14" fill="#044f1e">checks the landed commit,</text>
    <text x="800" y="201" text-anchor="middle" font-size="14" fill="#044f1e">cites a commit of its own</text>
  </g>

  <!-- forward arrows -->
  <line x1="284" y1="168" x2="354" y2="168" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="604" y1="168" x2="674" y2="168" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- refused self-judging loop -->
  <path d="M160,220 C160,292 480,292 480,224" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <g transform="translate(320,272)">
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#cf222e" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-11" y1="11" x2="11" y2="-11" stroke="#cf222e" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="500" y="262" font-size="14" fill="#cf222e">builder-1 tries to be its own tester</text>
  <text x="40" y="330" font-size="15" fill="#1f2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cf222e">refused: builder-1 already worked on stage build of this idea; the judge of test must differ</tspan></text>
  <text x="40" y="356" font-size="14" fill="#57606a">Real message from lab.py done; the command exits 1. The same rule covers apply and validate.</text>
</svg>
